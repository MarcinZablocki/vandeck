<text x="172" y="690" text-anchor="middle" font-size="9" fill="#fff">LIN</text>
<text x="200" y="690" text-anchor="middle" font-size="9" fill="#fff">GND</text>
<rect x="326" y="670" width="56" height="32" rx="3" fill="#3a7bd5"/><text x="354.0" y="664" text-anchor="middle" font-size="11" class="t">TB1</text>
<text x="340" y="690" text-anchor="middle" font-size="9" fill="#fff">12V</text>
<text x="368" y="690" text-anchor="middle" font-size="9" fill="#fff">GND</text><g class="t">
<text x="500" y="470" class="h">Wiring notes</text>
<text x="500" y="494">1. J1 plugs into 3V3 / GND / IO2 / IO3 on the CrowPanel</text><text x="500" y="510">    expansion header (confirm pin order on your board).</text>
<text x="500" y="534">2. Pull the two 5V pins out of the strip so 5 V never</text><text x="500" y="550">    reaches this board.</text>
<text x="500" y="574">3. TB1: van 12 V (fused) and GND. TB2: LIN wire and GND.</text>
<text x="500" y="598">4. Under the board: 3V3 rail to R4, R5, U1 pin 2; GND rail to</text><text x="500" y="614">    J1, TB1, TB2, U1 pin 5, C1, C2. U1 pin 8 (INH) unconnected.</text>
<text x="500" y="638">5. Placement is a suggestion. Check continuity before power.</text>
</g></svg>
