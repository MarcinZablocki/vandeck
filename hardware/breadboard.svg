<text x="24" y="440" class="h">Wiring list</text>
<text x="24" y="464" class="t">Signals: IO2 to hole 3, 470 R 3-7, hole 7 to module TX. Module RX to hole 10, 1k R1 10-14, hole 14 to IO3, 10k R2 hole 14 to GND rail.</text>
<text x="24" y="484" class="t">3V3 rail: CrowPanel 3V3 into hole 4, module SLP terminal from hole 6.</text>
<text x="24" y="504" class="t">GND rail, five wires: CrowPanel GND (16), module GND MCU-side terminal (18), module GND bus-side terminal (20),</text>
<text x="24" y="524" class="t">    battery GND (22), LIN line GND from the RJ12 splitter (24). All five are now one net.</text>
<text x="24" y="544" class="t">Test first: module powered, IO3 wire out. Hole 14 to GND must read 2.5 V to 3.3 V. Then plug the IO3 wire in.</text>
<text x="24" y="564" class="t">Still off the breadboard: +12 V to the module VIN and the LIN wire to the module LIN terminal, both on the module's own terminal block.</text>
<text x="24" y="584" class="t">GND wires carry only the module's few mA here. Do not run other loads' return current through this board.</text>
