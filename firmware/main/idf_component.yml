dependencies:
  idf: ">=6.0"
  lvgl/lvgl: "==9.4.0"
  # Local copy of 2.9.0 with two patches (same as ESP32-Truma): DPI on_frame_buf_complete -> on_refresh_done for
  # IDF 6.0, and a GT911 I2C read error reports "released" instead of aborting. Drop once upstream fixes both.
  espressif/esp_lvgl_port:
    version: "^2.6"
    override_path: "../components/esp_lvgl_port"
  espressif/esp_lcd_ek79007: "==2.0.2~1"
  espressif/esp_lcd_touch_gt911: "==1.2.1"
  # Same versions ESP32-Truma runs on this board; its C6 slave firmware is 2.12.x (host and slave must match major.minor).
  # Patched copy of 2.12.8: hosted_malloc_align falls back to PSRAM when internal DMA RAM can't fit a request
  # (see the VanDeck patch in host/port/esp/freertos/src/port_esp_hosted_host_os.c). Docs, examples and the
  # slave firmware sources are left out. Drop once upstream falls back on its own.
  espressif/esp_hosted:
    version: "==2.12.8"
    override_path: "../components/esp_hosted"
  # esp_matter 1.6.0 asks for esp_wifi_remote ^0.7 (IDF 5.x), which can't drive the C6 on IDF 6. override_path
  # makes the solver take this unmodified copy of 1.6.0 instead (IDF 6.0/6.1 sources only; examples and tests left
  # out). The directory has the registry-style name because esp_matter REQUIRES the component by that name.
  espressif/esp_wifi_remote:
    version: "==1.6.0"
    override_path: "../components/espressif__esp_wifi_remote"
  espressif/mdns: "^1.8"                    # vandeck.local for OTA uploads
  espressif/esp_websocket_client: "^1.8"    # outbound link to the Cloudflare relay (net/relay_svc.c)
  valdanylchuk/breezybox: "^1.1.1"          # BusyBox-style shell on the USB serial port (needs the littlefs partition)
  joltwallet/littlefs: "^1.20"              # (BreezyBox brings it) io/gps.c asks it for free space
  # Matter node for Apple Home (net/matter_svc.cpp). 1.6.0 targets IDF 5.5 but builds on 6.0.1 (two warnings relaxed
  # in the top-level CMakeLists.txt). Pairing is on-network: CHIPoBLE is off, NimBLE stays ble_svc's.
  espressif/esp_matter:
    version: "==1.6.0"
